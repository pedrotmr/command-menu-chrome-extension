<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keybar organizer sample</title>
    <style>
      :root {
        font:
          16px/1.6 system-ui,
          sans-serif;
        color: #263027;
        background: #f3f0e8;
      }
      main {
        max-width: 640px;
        margin: 12vh auto;
        padding: 36px;
        border-radius: 18px;
        background: #fffdf8;
      }
      small {
        color: #687365;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 34px;
        line-height: 1.2;
      }
      p {
        color: #5d635a;
      }
      .label {
        margin-top: 28px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <small>Local synthetic tab</small>
      <h1 id="title"></h1>
      <p id="topic"></p>
      <p class="label">This page is part of the isolated AI tab organizer prototype and contains no personal data.</p>
    </main>
    <script src="page.js" type="module"></script>
  </body>
</html>
