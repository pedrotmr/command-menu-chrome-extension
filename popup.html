<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      width: 640px;
      height: 480px;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      color: white;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 
        0 0 0 1px rgba(255, 255, 255, 0.1),
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 8px 32px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(20px);
      position: relative;
    }

    /* Glassmorphism effect */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    }

    .search-container {
      padding: 24px 24px 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 36px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      opacity: 0.5;
    }

    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-weight: 400;
      padding: 16px 20px 16px 48px;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
    }

    /* .search-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    } */

    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
      font-weight: 400;
    }

    .results {
      height: 400px;
      overflow-y: auto;
      padding: 8px;
    }

    .result-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      margin: 2px 0;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      position: relative;
    }

    .result-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .result-item.selected {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border-color: rgba(59, 130, 246, 0.3);
      box-shadow: 
        0 4px 12px rgba(59, 130, 246, 0.2),
        0 0 0 1px rgba(59, 130, 246, 0.1);
      transform: translateY(-1px);
    }

    .result-item.selected::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
      border-radius: 10px;
      pointer-events: none;
    }

    .item-icon {
      font-size: 20px;
      margin-right: 16px;
      width: 24px;
      text-align: center;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .item-url {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .result-item.selected .item-url {
      color: rgba(255, 255, 255, 0.8);
    }

    .item-type {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      flex-shrink: 0;
      margin-left: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .result-item.selected .item-type {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.9);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Web search specific styling */
    .result-item[data-type="web-search"] {
      border: 1px solid rgba(34, 197, 94, 0.2);
      background: rgba(34, 197, 94, 0.05);
    }

    .result-item[data-type="web-search"]:hover {
      background: rgba(34, 197, 94, 0.1);
      border-color: rgba(34, 197, 94, 0.3);
    }

    .result-item[data-type="web-search"].selected {
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      border-color: rgba(34, 197, 94, 0.4);
      box-shadow: 
        0 4px 12px rgba(34, 197, 94, 0.2),
        0 0 0 1px rgba(34, 197, 94, 0.1);
    }

    .result-item[data-type="web-search"] .item-type {
      background: rgba(34, 197, 94, 0.15);
      color: rgba(34, 197, 94, 0.9);
      border-color: rgba(34, 197, 94, 0.2);
    }

    .result-item[data-type="web-search"].selected .item-type {
      background: rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.9);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .no-results, .loading {
      padding: 60px 24px;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 15px;
      font-weight: 400;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      margin-left: 12px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Custom scrollbar */
    .results::-webkit-scrollbar {
      width: 6px;
    }

    .results::-webkit-scrollbar-track {
      background: transparent;
      border-radius: 3px;
    }

    .results::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      transition: background 0.2s ease;
    }

    .results::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Subtle animations */
    .result-item {
      animation: fadeInUp 0.2s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Focus ring for accessibility */
    /* .search-input:focus-visible {
      outline: 2px solid #3b82f6;
      outline-offset: 2px;
    } */
  </style>
</head>
<body>
  <div class="search-container">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.35-4.35"></path>
    </svg>
    <input type="text" placeholder="Search commands or bookmarks..." class="search-input" id="searchInput" />
  </div>
  <div class="results" id="results">
    <div class="loading">Loading bookmarks...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
